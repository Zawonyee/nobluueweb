<style>
* {

}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #f2f4f7;
  color: #111827;
  font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
}

.toolbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 64px;
  padding: 12px 24px;
  background: rgba(255, 255, 255, 0.94);
  border-bottom: 1px solid #d9dee7;
  backdrop-filter: blur(12px);
}

.title {
  min-width: 0;
}

.title h1 {
  margin: 0;
  font-size: 20px;
  line-height: 1.25;
  font-weight: 700;
}

.title p {
  margin: 3px 0 0;
  color: #64748b;
  font-size: 13px;
}

.download {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 0 16px;
  border-radius: 6px;
  background: #111827;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
  white-space: nowrap;
}

.download:focus-visible {
  outline: 3px solid #93c5fd;
  outline-offset: 2px;
}

.viewer {
  flex: 1 1 auto;
  width: 100%;
  min-height: calc(100vh - 64px);
  border: 0;
  background: #fff;
}

.fallback {
  display: grid;
  min-height: calc(100vh - 64px);
  place-items: center;
  padding: 32px;
  text-align: center;
}

.fallback a {
  color: #0f766e;
  font-weight: 700;
}

@media (max-width: 640px) {
  .toolbar {
    align-items: flex-start;
    flex-direction: column;
    padding: 12px 16px;
  }

  .download {
    width: 100%;
  }

  .viewer,
  .fallback {
    min-height: calc(100vh - 105px);
  }
}
</style>
</head>
<body>
<header class="toolbar">
  <div class="title">
    <h1>黄梓皓简历</h1>
    <p>PDF 原文件在线预览</p>
  </div>
  <a class="download" href="resume.pdf" download="黄梓皓附件简历.pdf">下载 PDF</a>
</header>

<object class="viewer" data="resume.pdf" type="application/pdf" aria-label="黄梓皓附件简历 PDF 预览">
